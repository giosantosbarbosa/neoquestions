<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeoQuestions IF — Envie sua Pergunta</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
                <div class="logo-container neoquestions-logo-container">
            <img src="assets/img/logo-neoquestions.png" alt="NeoQuestions IF" class="if-logo">
        </div>
        <p>Seminário: Teoria Neoclássica da Administração</p>
    </header>

    <main class="container">
        
        <section class="intro-section">
            <h2>Participe do Seminário</h2>
            <p>Envie as suas dúvidas ou comentários em tempo real para os apresentadores.</p>
        </section>

        <section class="form-container">
            <form id="questionForm">
                <div class="input-group">
                    <label for="userName">
                        <i class="fa-solid fa-user"></i> Seu Nome (Opcional)
                    </label>
                    <input type="text" id="userName" placeholder="Ex: Maria Silva" autocomplete="name">
                </div>

                <div class="input-group">
                    <label for="userQuestion">
                        <i class="fa-solid fa-comment-dots"></i> Sua Pergunta
                    </label>
                    <textarea id="userQuestion" required placeholder="Escreva aqui a sua dúvida sobre a Teoria Neoclássica..."></textarea>
                </div>

                <button type="submit" class="btn-send" id="btnSubmit">
                    <span>Enviar Pergunta</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </section>

        <section class="suggestions">
            <h3><i class="fa-solid fa-lightbulb"></i> Sugestões de Temas</h3>
            
            <div class="suggestions-wrapper" style="position: relative; display: flex; align-items: center;">
                <button type="button" class="scroll-arrow left" onclick="scrollSuggestions(-200)">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <div id="chipsContainer" class="suggestion-chips">
                    <button type="button" class="chip" onclick="fillQuestion('Qual o foco principal desta teoria?')">Foco da Teoria</button>
                    <button type="button" class="chip" onclick="fillQuestion('O que significa o pragmatismo neoclássico?')">Pragmatismo</button>
                    <button type="button" class="chip" onclick="fillQuestion('O que é o ecletismo neoclássico?')">Ecletismo</button>
                    <button type="button" class="chip" onclick="fillQuestion('Quais são os três níveis organizacionais?')">3 Níveis</button>
                    <button type="button" class="chip" onclick="fillQuestion('Como a teoria define Autoridade?')">Autoridade</button>
                    <button type="button" class="chip" onclick="fillQuestion('Qual a função da Organização?')">Organização</button>
                    <button type="button" class="chip" onclick="fillQuestion('O que faz a Direção?')">Direção</button>
                    <button type="button" class="chip" onclick="fillQuestion('O que é a Cadeia Escalar?')">Cadeia Escalar</button>
                    <button type="button" class="chip" onclick="fillQuestion('O que é Amplitude Administrativa?')">Amplitude Adm.</button>
                </div>

                <button type="button" class="scroll-arrow right" onclick="scrollSuggestions(200)">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </section>                  

        <section class="feed-section">
            <h3>Perguntas da Plateia</h3>
            <div id="questionsFeed" class="questions-list">
                <div class="loading-state">
                    <p>Carregando interações...</p>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer-simple">
        <div class="logo-container if-logo-container">
            <img src="assets/img/logo-if.png" alt="IF Sul de Minas" class="if-logo">
        </div>
        <p>Desenvolvido por Giovanna Barbosa &copy; 2026</p>
    </footer>

    <script src="app.js"></script>
    
    <script>
        /**
         * Função utilitária para preencher o campo de pergunta
         * Esta lógica pode ser movida para o app.js futuramente.
         */
        function fillQuestion(text) {
            const textarea = document.getElementById('userQuestion');
            textarea.value = text;
            textarea.focus();
            
            // Pequeno feedback visual no chip
            window.scrollTo({ top: 200, behavior: 'smooth' });
        }
    </script>
</body>
</html>
